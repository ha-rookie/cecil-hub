name: Cloudflare deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate approved icon derivatives
        shell: bash
        run: |
          set -eu
          test -f docs/design/assets/issue-41-icons/cecil-favicon-master.png
          test -f docs/design/assets/issue-41-icons/cecil-apple-touch-icon-master.png
          node --check scripts/generate_app_icons.cjs
          npm run build:icons
          test -f public/icons/favicon-16x16.png
          test -f public/icons/favicon-32x32.png
          test -f public/icons/apple-touch-icon.png

      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets are not registered yet. Preview upload skipped."
            exit 0
          fi

          set +e
          output=$(npx --yes wrangler@4 versions upload --preview-alias "pr-${PR_NUMBER}" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if printf '%s' "$output" | grep -q "does not yet exist"; then
            echo "::notice::Worker does not exist yet. Bootstrapping once with workers_dev disabled."
            npx --yes wrangler@4 deploy
            npx --yes wrangler@4 versions upload --preview-alias "pr-${PR_NUMBER}"
            exit 0
          fi

          exit "$status"

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate approved icon derivatives
        shell: bash
        run: |
          set -eu
          test -f docs/design/assets/issue-41-icons/cecil-favicon-master.png
          test -f docs/design/assets/issue-41-icons/cecil-apple-touch-icon-master.png
          node --check scripts/generate_app_icons.cjs
          npm run build:icons
          test -f public/icons/favicon-16x16.png
          test -f public/icons/favicon-32x32.png
          test -f public/icons/apple-touch-icon.png

      - name: Deploy approved main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets are not registered yet. Production deploy skipped."
            exit 0
          fi
          npx --yes wrangler@4 deploy

      - name: Production analytics smoke
        shell: bash
        run: |
          set -eu
          url="https://cecil-hub.ha-rookie.workers.dev/api/event"
          origin="https://cecil-hub.ha-rookie.workers.dev"
          status="000"

          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST "$url" \
              --header "Origin: $origin" \
              --header "Content-Type: application/json" \
              --data '{"event":"deployment_smoke_test"}' || true)

            if [ "$status" = "204" ]; then
              echo "Analytics smoke succeeded on attempt $attempt."
              exit 0
            fi

            echo "Analytics smoke attempt $attempt: HTTP $status"
            if [ "$attempt" -lt 6 ]; then
              sleep 5
            fi
          done

          echo "Analytics smoke failed after retries: HTTP $status"
          exit 1


      - name: Production security headers smoke
        shell: bash
        run: |
          set -eu
          url="https://cecil-hub.ha-rookie.workers.dev/"
          headers="$(curl --silent --show-error --head "$url" | tr -d '\r')"

          printf '%s\n' "$headers"

          require_header() {
            name="$1"
            pattern="$2"
            if ! printf '%s\n' "$headers" | grep -Eiq "^${name}:[[:space:]]*${pattern}[[:space:]]*$"; then
              echo "::error::Missing or unexpected ${name}"
              exit 1
            fi
          }

          require_header "Content-Security-Policy" ".+"
          require_header "Strict-Transport-Security" "max-age=31536000"
          require_header "X-Frame-Options" "DENY"
          require_header "X-Content-Type-Options" "nosniff"
          require_header "Referrer-Policy" "strict-origin-when-cross-origin"
          require_header "Permissions-Policy" "camera=\(\), microphone=\(\), geolocation=\(\)"
          require_header "X-Permitted-Cross-Domain-Policies" "none"

          echo "Production security headers smoke succeeded."
