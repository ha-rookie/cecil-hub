name: Cloudflare deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets are not registered yet. Preview upload skipped."
            exit 0
          fi

          set +e
          output=$(npx --yes wrangler@4 versions upload --preview-alias "pr-${PR_NUMBER}" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if printf '%s' "$output" | grep -q "does not yet exist"; then
            echo "::notice::Worker does not exist yet. Bootstrapping once with workers_dev disabled."
            npx --yes wrangler@4 deploy
            npx --yes wrangler@4 versions upload --preview-alias "pr-${PR_NUMBER}"
            exit 0
          fi

          exit "$status"

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Deploy approved main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::Cloudflare secrets are not registered yet. Production deploy skipped."
            exit 0
          fi
          npx --yes wrangler@4 deploy

      - name: Production analytics smoke
        shell: bash
        run: |
          set -eu
          url="https://cecil-hub.ha-rookie.workers.dev/api/event"
          origin="https://cecil-hub.ha-rookie.workers.dev"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST "$url" \
            --header "Origin: $origin" \
            --header "Content-Type: application/json" \
            --data '{"event":"deployment_smoke_test"}')
          test "$status" = "204" || { echo "Analytics smoke failed: HTTP $status"; exit 1; }
