name: Cleanup accidental Cecil Pages project

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.pull_request.number == 14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Delete accidental Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 pages project delete cecil-hub --yes

      - name: Verify Pages project is gone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project list --json > /tmp/pages.json
          if python3 - <<'PY'
          import json
          with open('/tmp/pages.json', encoding='utf-8') as f:
              projects = json.load(f)
          names = {p.get('Name') or p.get('name') for p in projects}
          raise SystemExit(0 if 'cecil-hub' not in names else 1)
          PY
          then
            echo "cecil-hub Pages project deleted: OK"
          else
            echo "::error::cecil-hub Pages project still exists"
            cat /tmp/pages.json
            exit 1
          fi
