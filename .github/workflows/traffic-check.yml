name: Repository traffic check

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      issue_number:
        description: "結果を書き込むIssue番号"
        required: true
        default: "57"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.actor == 'ha-rookie' &&
       github.event.issue.number == 57 &&
       github.event.comment.body == '/traffic-check') ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'ha-rookie')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_ISSUE: ${{ github.event_name == 'issue_comment' && github.event.issue.number || inputs.issue_number }}
      TRAFFIC_READ_TOKEN: ${{ secrets.TRAFFIC_READ_TOKEN }}
    steps:
      - name: Query public repository traffic and post report
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const consoleRepo = context.repo.repo;
            const issueNumber = Number(process.env.TARGET_ISSUE);
            const trafficToken = process.env.TRAFFIC_READ_TOKEN;
            const apiVersion = '2026-03-10';

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Invalid TARGET_ISSUE.');
              return;
            }

            const postComment = async (body) => {
              await github.rest.issues.createComment({
                owner,
                repo: consoleRepo,
                issue_number: issueNumber,
                body
              });
            };

            if (!trafficToken) {
              await postComment([
                '⚠️ `TRAFFIC_READ_TOKEN` が未設定です。',
                '',
                'Repository Trafficを取得するには、Fine-grained PATをRepository Secret `TRAFFIC_READ_TOKEN` として登録してください。',
                'PATで確認対象にしたいRepositoryを選択し、Repository permissionは **Administration: Read-only** にしてください。',
                '',
                'Token値はこのIssueやActionsログへ出力しません。'
              ].join('\n'));
              return;
            }

            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${trafficToken}`,
              'X-GitHub-Api-Version': apiVersion
            };

            const selectedRepos = [];
            for (let page = 1; page <= 10; page += 1) {
              const reposResponse = await fetch(
                `https://api.github.com/user/repos?affiliation=owner&per_page=100&page=${page}`,
                { headers }
              );

              if (!reposResponse.ok) {
                const status = `${reposResponse.status} ${reposResponse.statusText}`;
                await postComment([
                  '⚠️ Fine-grained PATでRepository一覧を取得できませんでした。',
                  '',
                  `- HTTP: \`${status}\``,
                  '- `TRAFFIC_READ_TOKEN` の有効期限・Resource owner・Repository accessを確認してください。',
                  '- Repository permissionは **Administration: Read-only** が必要です。',
                  '',
                  'Token値は出力していません。'
                ].join('\n'));
                return;
              }

              const pageRepos = await reposResponse.json();
              if (!Array.isArray(pageRepos) || pageRepos.length === 0) break;
              selectedRepos.push(...pageRepos);
              if (pageRepos.length < 100) break;
            }

            const publicRepos = selectedRepos
              .filter((item) => item?.owner?.login === owner && item?.private === false)
              .sort((a, b) => String(a.name).localeCompare(String(b.name)));

            if (publicRepos.length === 0) {
              await postComment([
                '## Repository Traffic report',
                '',
                '現在、`TRAFFIC_READ_TOKEN` から確認できるPublic repositoryはありません。',
                '',
                `Checked at: \`${new Date().toISOString()}\``
              ].join('\n'));
              return;
            }

            const failures = [];
            const getTrafficJson = async (repoName, endpoint, label) => {
              const response = await fetch(
                `https://api.github.com/repos/${owner}/${repoName}/traffic/${endpoint}`,
                { headers }
              );

              if (!response.ok) {
                failures.push({
                  repo: repoName,
                  metric: label,
                  status: `${response.status} ${response.statusText}`
                });
                return null;
              }

              return response.json();
            };

            const reports = [];
            for (const repository of publicRepos) {
              const repoName = repository.name;

              const [clones, views, referrers, paths] = await Promise.all([
                getTrafficJson(repoName, 'clones', 'clones'),
                getTrafficJson(repoName, 'views', 'views'),
                getTrafficJson(repoName, 'popular/referrers', 'referrers'),
                getTrafficJson(repoName, 'popular/paths', 'popular paths')
              ]);

              reports.push({
                name: repoName,
                url: repository.html_url,
                forks: repository.forks_count ?? 0,
                clones: clones?.count ?? null,
                uniqueCloners: clones?.uniques ?? null,
                cloneDaily: Array.isArray(clones?.clones) ? clones.clones : [],
                views: views?.count ?? null,
                uniqueVisitors: views?.uniques ?? null,
                viewDaily: Array.isArray(views?.views) ? views.views : [],
                referrers: Array.isArray(referrers) ? referrers : [],
                paths: Array.isArray(paths) ? paths : []
              });
            }

            const value = (input) => input === null || input === undefined ? '取得失敗' : input;
            const mdCell = (input) => String(input ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ');
            const checkedAt = new Date().toISOString();

            const summaryRows = reports.map((item) =>
              `| [${mdCell(item.name)}](${item.url}) | ${item.forks} | ${value(item.clones)} | ${value(item.uniqueCloners)} | ${value(item.views)} | ${value(item.uniqueVisitors)} |`
            ).join('\n');

            const detailSections = reports.map((item) => {
              const byDate = new Map();

              for (const daily of item.cloneDaily) {
                const date = String(daily.timestamp ?? '').slice(0, 10) || '(unknown)';
                byDate.set(date, {
                  ...(byDate.get(date) ?? {}),
                  clones: daily.count ?? 0,
                  uniqueCloners: daily.uniques ?? 0
                });
              }

              for (const daily of item.viewDaily) {
                const date = String(daily.timestamp ?? '').slice(0, 10) || '(unknown)';
                byDate.set(date, {
                  ...(byDate.get(date) ?? {}),
                  views: daily.count ?? 0,
                  uniqueVisitors: daily.uniques ?? 0
                });
              }

              const dailyRows = [...byDate.entries()]
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([date, daily]) =>
                  `| ${date} | ${daily.clones ?? 0} | ${daily.uniqueCloners ?? 0} | ${daily.views ?? 0} | ${daily.uniqueVisitors ?? 0} |`
                )
                .join('\n') || '| - | 0 | 0 | 0 | 0 |';

              const referrerRows = item.referrers.length
                ? item.referrers.map((referrer) =>
                    `| ${mdCell(referrer.referrer)} | ${referrer.count ?? 0} | ${referrer.uniques ?? 0} |`
                  ).join('\n')
                : '| - | 0 | 0 |';

              const pathRows = item.paths.length
                ? item.paths.map((path) =>
                    `| \`${mdCell(path.path)}\` | ${mdCell(path.title)} | ${path.count ?? 0} | ${path.uniques ?? 0} |`
                  ).join('\n')
                : '| - | - | 0 | 0 |';

              return [
                `<details><summary>${mdCell(item.name)} details</summary>`,
                '',
                '### Daily traffic (UTC)',
                '',
                '| Date | Clones | Unique cloners | Views | Unique visitors |',
                '| --- | ---: | ---: | ---: | ---: |',
                dailyRows,
                '',
                '### Top referrers (14 days)',
                '',
                '| Referrer | Count | Uniques |',
                '| --- | ---: | ---: |',
                referrerRows,
                '',
                '### Popular paths (14 days)',
                '',
                '| Path | Title | Count | Uniques |',
                '| --- | --- | ---: | ---: |',
                pathRows,
                '',
                '</details>'
              ].join('\n');
            }).join('\n\n');

            const failureLines = failures.length
              ? [
                  '',
                  '### 取得失敗',
                  ...failures.map((item) =>
                    `- \`${item.repo}\` / ${item.metric}: HTTP \`${item.status}\``
                  )
                ]
              : [];

            await postComment([
              '## Repository Traffic report',
              '',
              '| Public repository | Forks | Clones (14 days) | Unique cloners | Views (14 days) | Unique visitors |',
              '| --- | ---: | ---: | ---: | ---: | ---: |',
              summaryRows,
              '',
              detailSections,
              ...failureLines,
              '',
              `Checked at: \`${checkedAt}\``,
              '',
              '> `TRAFFIC_READ_TOKEN` が参照できるRepositoryのうち、実行時点でPublicなものだけを表示しています。Private repositoryの情報は公開Issueへ出力しません。',
              '> GitHub Traffic APIのClone / Viewは直近14日分・UTC基準です。Cloneはfull cloneで、fetchは含まれません。',
              '> Unique cloners / Unique visitorsから個人を特定したり、人間とbotを区別したりすることはできません。'
            ].join('\n'));
